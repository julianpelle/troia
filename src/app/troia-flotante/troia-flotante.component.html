<button class="troia" type="button" (click)="troia.alternar()"
        [attr.aria-pressed]="(troia.silenciada$ | async) ? 'true' : 'false'"
        [title]="(troia.silenciada$ | async) ? 'TROIA silenciada: tocá para activarla' : 'TROIA'"
        [attr.aria-label]="(troia.silenciada$ | async) ? 'TROIA silenciada. Tocá para activarla' : 'TROIA: tocá para silenciarla o repetir la explicación'">
  <canvas #wave class="onda" [class.oculta]="!(troia.hablando$ | async)" width="150" height="150"></canvas>
  <span class="circulo" [class.hablando]="troia.hablando$ | async" [class.silenciada]="troia.silenciada$ | async">
    <img src="assets/img.png" alt="TROIA" />
  </span>
  <span class="mute-badge" [class.visible]="troia.silenciada$ | async" aria-hidden="true">
    <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M11 5 6 9H3v6h3l5 4V5z" />
      <path d="M22 9l-6 6M16 9l6 6" />
    </svg>
  </span>
</button>
